name: Build Telegram X

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone All Submodules Recursively
        run: |
          python3 -c '
          import configparser, subprocess, os, shutil

          def process_gitmodules(base_dir):
              gitmodules_path = os.path.join(base_dir, ".gitmodules")
              if not os.path.exists(gitmodules_path):
                  return
              config = configparser.ConfigParser()
              config.read(gitmodules_path)
              for section in config.sections():
                  path = config.get(section, "path", fallback=None)
                  url = config.get(section, "url", fallback=None)
                  if not path or not url:
                      continue
                  branch = config.get(section, "branch", fallback=None)
                  full_path = os.path.join(base_dir, path)
                  
                  has_files = os.path.exists(full_path) and len([x for x in os.listdir(full_path) if x != ".git"]) > 0
                  if not has_files:
                      print(f"Cloning submodule {path} from {url} into {full_path}...")
                      if os.path.exists(full_path):
                          shutil.rmtree(full_path, ignore_errors=True)
                      dirname = os.path.dirname(full_path)
                      if dirname:
                          os.makedirs(dirname, exist_ok=True)
                      cmd = ["git", "clone", "--depth", "1"]
                      if branch:
                          cmd.extend(["-b", branch])
                      cmd.extend([url, full_path])
                      subprocess.run(cmd, check=False)
                  
                  process_gitmodules(full_path)

          process_gitmodules(".")
          '

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          SDK_PACKAGE=$(grep "version.sdk_package" version.properties | cut -d'=' -f2)
          BUILD_TOOLS_VERSION=$(grep "version.build_tools" version.properties | cut -d'=' -f2)
          NDK_PRIMARY=$(grep "version.ndk_primary" version.properties | cut -d'=' -f2)
          NDK_LEGACY=$(grep "version.ndk_legacy" version.properties | cut -d'=' -f2)
          CMAKE_VERSION=$(grep "version.cmake" version.properties | cut -d'=' -f2)
          
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;$SDK_PACKAGE" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_PRIMARY" "ndk;$NDK_LEGACY" "cmake;$CMAKE_VERSION" || true

      - name: Create local.properties
        run: |
          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          app.disable_signing=true
          app.id=org.thunderdog.challegram
          app.name=Telegram X
          app.download_url=https://telegram.org/dlx
          app.sources_url=https://github.com/${{ github.repository }}
          telegram.api_id=6
          telegram.api_hash=eb066357e523465a1914b35945e486d8
          tgx.extension=none
          EOF

      - name: Make scripts and gradlew executable
        run: chmod +x gradlew scripts/*.sh

      - name: Build Telegram X
        run: ./gradlew assembleLatestUniversalDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
