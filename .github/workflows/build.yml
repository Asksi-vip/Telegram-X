name: Build Telegram X

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Submodules Exist
        run: |
          for dir in vkryl/leveldb vkryl/core vkryl/android vkryl/td tdlib; do
            if [ ! -d "$dir" ] || [ -z "$(ls -A $dir 2>/dev/null)" ]; then
              echo "Submodule $dir missing or empty, re-cloning..."
              git submodule update --init --recursive --depth=1 $dir || true
            fi
          done
          for dir in vkryl/leveldb vkryl/core vkryl/android vkryl/td tdlib; do
            if [ ! -d "$dir" ] || [ -z "$(ls -A $dir 2>/dev/null)" ]; then
              echo "FATAL: Submodule $dir still missing"
              exit 1
            fi
          done
          echo "All critical submodules present"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          SDK_PACKAGE=$(grep "^version.sdk_package=" version.properties | cut -d'=' -f2 | cut -d'.' -f1)
          BUILD_TOOLS_VERSION=$(grep "^version.build_tools=" version.properties | cut -d'=' -f2)
          NDK_PRIMARY=$(grep "^version.ndk_primary=" version.properties | cut -d'=' -f2)
          NDK_LEGACY=$(grep "^version.ndk_legacy=" version.properties | cut -d'=' -f2)
          CMAKE_VERSION=$(grep "^version.cmake=" version.properties | cut -d'=' -f2)
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "platforms;$SDK_PACKAGE" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_PRIMARY" "ndk;$NDK_LEGACY" "cmake;$CMAKE_VERSION" || true

      - name: Create local.properties
        run: |
          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          app.disable_signing=true
          app.id=org.thunderdog.challegramx.custom
          app.name=Telegram X
          app.download_url=https://telegram.org/dlx
          app.sources_url=https://github.com/${{ github.repository }}
          telegram.api_id=26090096
          telegram.api_hash=c877f99828a0a8a9d79cfb9a5791a020
          tgx.extension=none
          EOF

      - name: Make scripts and gradlew executable
        run: chmod +x gradlew scripts/*.sh

      - name: Build Telegram X
        run: ./gradlew assembleLatestUniversalDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
